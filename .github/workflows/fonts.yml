name: Polices (auto-hébergement)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p fonts
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sA "$UA" "https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" > fonts/archivo.css
          grep -o "https://fonts.gstatic.com/[^)]*" fonts/archivo.css | while read u; do curl -s "$u" -o "fonts/$(basename $u)"; done
          curl -sL "https://cdn.tailwindcss.com/3.4.17" -o fonts/tailwind-3.4.17.js
          curl -sL "https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js" -o fonts/heic2any.min.js
          ls -la fonts
          git config user.name github-actions; git config user.email github-actions@github.com
          git add fonts && git commit -m "Fichiers à auto-héberger" && git push
