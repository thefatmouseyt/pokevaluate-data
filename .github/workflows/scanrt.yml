name: Moteur de calcul du scan (copie figée)
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Version de onnxruntime-web', default: '1.20.1' }
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: |
          V="${{ github.event.inputs.version || '1.20.1' }}"
          npm pack "onnxruntime-web@$V" --silent && tar xzf onnxruntime-web-*.tgz
          ls -la package/dist | head -60
          mkdir -p /tmp/rt && cp package/dist/ort.wasm.min.js package/dist/ort-wasm-simd-threaded.mjs package/dist/ort-wasm-simd-threaded.wasm /tmp/rt/ && echo "$V" > /tmp/rt/VERSION
          git config user.name "pokevaluate-bot"; git config user.email "noreply@github.com"
          git checkout -q --orphan rt-new && git rm -rfq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/rt/* . && git add -A && git commit -qm "Moteur de calcul du scan $V" && git push -qf origin rt-new:scanrt
