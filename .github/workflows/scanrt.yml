name: Moteur de calcul du scan (copie figée)
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Version de onnxruntime-web', default: '1.20.1' }
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: |
          V="${{ github.event.inputs.version || '1.20.1' }}"
          npm pack "onnxruntime-web@$V" --silent && tar xzf onnxruntime-web-*.tgz
          ls -la package/dist | head -60
          rm -rf index/scan-rt && mkdir -p index/scan-rt
          cp package/dist/ort.wasm.min.js package/dist/ort-wasm-simd-threaded.mjs package/dist/ort-wasm-simd-threaded.wasm index/scan-rt/
          echo "$V" > index/scan-rt/VERSION
          git config user.name "pokevaluate-bot"; git config user.email "noreply@github.com"
          git add -A index/scan-rt
          git diff --cached --quiet || (git commit -m "Moteur de calcul du scan $V" && git pull --rebase -q && git push)
