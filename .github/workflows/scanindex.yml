name: Index du scan (reconnaissance d'image)
on:
  workflow_dispatch:
  schedule:
    - cron: "13 7 * * 1"   # chaque lundi, après les empreintes : nouvelles cartes du catalogue
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      # scripts tenus dans le dépôt privé : copiés ici le temps du passage (jeton en lecture seule)
      - env: { SCRIPTS_TOKEN: "${{ secrets.SCRIPTS_TOKEN }}" }
        run: |
          [ -z "$SCRIPTS_TOKEN" ] && exit 0
          git clone -q --depth 1 "https://x-access-token:${SCRIPTS_TOKEN}@github.com/thefatmouseyt/pokevaluate.git" "$RUNNER_TEMP/p"
          mkdir -p tools && cp -r "$RUNNER_TEMP/p/robots/." tools/ && rm -rf "$RUNNER_TEMP/p"
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with: { path: imgcache, key: "imgcache-${{ github.run_id }}", restore-keys: "imgcache-" }
      - uses: actions/cache@v4
        with: { path: embscan, key: "embscan-${{ github.run_id }}", restore-keys: "embscan-" }
      - run: pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --quiet timm numpy pillow requests onnx onnxruntime onnxscript
      - run: python tools/scan/build_scan_index.py
        env: { IMG_DIR: imgcache, EMB_DIR: embscan }
      # branche « scan » : un seul commit, remplacé à chaque passage (hors de la branche principale : limite de 50 Mo par branche chez l'hébergeur)
      - name: Publier
        run: |
          git config user.name "pokevaluate-bot"; git config user.email "noreply@github.com"
          rm -rf /tmp/scan && cp -r index/scan /tmp/scan
          git checkout -q --orphan scan-new && git rm -rfq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/scan/* . && git add -A && git commit -qm "Index du scan du $(date -u +%F)" && git push -qf origin scan-new:scan
          for f in meta.json ids.bin emb.bin pca.bin; do curl -s "https://purge.jsdelivr.net/gh/thefatmouseyt/pokevaluate-data@scan/$f" > /dev/null || true; done
