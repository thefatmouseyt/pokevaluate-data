name: migrate
on: workflow_dispatch
permissions: { id-token: write, contents: read }
jobs:
  m:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/pt/migrate.mjs
