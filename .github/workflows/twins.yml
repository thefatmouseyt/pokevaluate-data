name: Jumelles des cartes (anglais ↔ japonais)
on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 1"   # chaque lundi, après les empreintes : nouvelles cartes du catalogue
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      # scripts tenus dans le dépôt privé : copiés ici le temps du passage (jeton en lecture seule)
      - env: { SCRIPTS_TOKEN: "${{ secrets.SCRIPTS_TOKEN }}" }
        run: |
          [ -z "$SCRIPTS_TOKEN" ] && exit 0
          git clone -q --depth 1 "https://x-access-token:${SCRIPTS_TOKEN}@github.com/thefatmouseyt/pokevaluate.git" "$RUNNER_TEMP/p"
          mkdir -p tools && cp -r "$RUNNER_TEMP/p/robots/." tools/ && rm -rf "$RUNNER_TEMP/p"
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with: { path: imgcache, key: "imgcache-${{ github.run_id }}", restore-keys: "imgcache-" }
      - uses: actions/cache@v4
        with: { path: embcache, key: "embcache-${{ github.run_id }}", restore-keys: "embcache-" }
      - run: pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --quiet timm numpy pillow requests
      - run: python tools/scan/twins.py
        env: { IMG_DIR: imgcache, EMB_DIR: embcache }
      - name: Publier
        run: |
          git config user.name "pokevaluate-bot"; git config user.email "noreply@github.com"
          git add index/twins.json
          git diff --cached --quiet || (git commit -m "Jumelles mises à jour" && git pull --rebase -q && git push)
