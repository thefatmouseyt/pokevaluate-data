name: Empreintes des cartes
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # chaque lundi : nouvelles cartes du catalogue
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      # scripts tenus dans le dépôt privé : copiés ici le temps du passage (jeton en lecture seule)
      - env: { SCRIPTS_TOKEN: "${{ secrets.SCRIPTS_TOKEN }}" }
        run: |
          [ -z "$SCRIPTS_TOKEN" ] && exit 0
          git clone -q --depth 1 "https://x-access-token:${SCRIPTS_TOKEN}@github.com/thefatmouseyt/pokevaluate.git" "$RUNNER_TEMP/p"
          mkdir -p tools && cp -r "$RUNNER_TEMP/p/robots/." tools/ && rm -rf "$RUNNER_TEMP/p"
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --quiet numpy pillow requests
      - run: python tools/build_index.py
      - run: python tools/build_fr.py
      - name: Publier
        run: |
          git config user.name "pokevaluate-bot"; git config user.email "noreply@github.com"
          git add index
          git diff --cached --quiet || (git commit -m "Empreintes mises à jour" && git push)
