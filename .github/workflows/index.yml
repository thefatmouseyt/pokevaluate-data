name: Empreintes des cartes
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # chaque lundi : nouvelles cartes du catalogue
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --quiet numpy pillow requests
      - run: python tools/build_index.py
      - run: python tools/build_fr.py
      - name: Publier
        run: |
          git config user.name "pokevaluate-bot"; git config user.email "noreply@github.com"
          git add index
          git diff --cached --quiet || (git commit -m "Empreintes mises à jour" && git push)
