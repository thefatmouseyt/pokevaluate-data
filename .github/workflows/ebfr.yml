name: Annonces eBay.fr (contrôle des cotes FR)
on:
  workflow_dispatch:
    inputs:
      calls: { description: "Nombre maximal d'appels eBay", default: '3000' }
  schedule:
    - cron: "37 6 * * *"
permissions:
  contents: write
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      # scripts tenus dans le dépôt privé : copiés ici le temps du passage (jeton en lecture seule)
      - env: { SCRIPTS_TOKEN: "${{ secrets.SCRIPTS_TOKEN }}" }
        run: |
          [ -z "$SCRIPTS_TOKEN" ] && exit 0
          git clone -q --depth 1 "https://x-access-token:${SCRIPTS_TOKEN}@github.com/thefatmouseyt/pokevaluate.git" "$RUNNER_TEMP/p"
          mkdir -p tools && cp -r "$RUNNER_TEMP/p/robots/." tools/ && rm -rf "$RUNNER_TEMP/p"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/prices/ebfr.mjs
        env: { MAX_CALLS: "${{ github.event.inputs.calls || '3000' }}" }
      - name: Publier
        run: |
          git config user.name "pokevaluate-bot"; git config user.email "noreply@github.com"
          git add index/ebayfr.json
          git diff --cached --quiet || (git commit -qm "Annonces eBay.fr" && git pull --rebase -q && git push -q)
          curl -s "https://purge.jsdelivr.net/gh/thefatmouseyt/pokevaluate-data@main/index/ebayfr.json" > /dev/null || true
