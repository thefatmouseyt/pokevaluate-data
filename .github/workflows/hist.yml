name: hist
on:
  workflow_dispatch:
    inputs:
      max_req: { description: 'Requêtes PokeTrace maximum', default: '5000' }
permissions: { id-token: write, contents: read }
jobs:
  h:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tools/prices/hist.mjs
        env:
          MAX_REQ: ${{ github.event.inputs.max_req || '5000' }}
